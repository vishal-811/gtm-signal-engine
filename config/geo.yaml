# Target markets, in tiers.
#
# A company matches when any alias appears as a whole phrase in its job-board
# locations (preferred) or its article-stated HQ. `tier` breaks ties: "San
# Francisco, CA, United States" matches both the sf-bay-area hub and the broad
# us-other region with identical alias lengths, so without explicit precedence
# the winner would depend on YAML ordering. Lower tier wins.
#
# Tier 1 — Hire100x's own network hubs. Best fit, scored highest in rubric.yaml.
# Tier 2 — rest of the countries where that network already is.
# Tier 3 — other markets that commonly hire remote US/India engineers.
#
# Anything matching nothing here is dropped. To stop covering a region, delete
# it — no code change needed.
#
# `countries` is deliberately unset now. Job-board locations rarely name a
# country ("Hybrid - San Francisco"), so requiring one rejected valid matches.
#
# Matching is case-insensitive on word boundaries, so "sf" will not match
# "sfo-adjacent" and "york" will not match "New York".

markets:
  # ── Tier 1: network hubs ────────────────────────────────────────────────────
  - id: sf-bay-area
    label: SF Bay Area
    tier: 1
    aliases:
      - san francisco
      - south san francisco
      - sf
      - bay area
      - silicon valley
      - palo alto
      - mountain view
      - menlo park
      - redwood city
      - san mateo
      - foster city
      - burlingame
      - sunnyvale
      - santa clara
      - san jose
      - cupertino
      - oakland
      - berkeley
      - emeryville
      - alameda
      - fremont
      - los altos
      - belmont

  - id: nyc-metro
    label: NYC Metro
    tier: 1

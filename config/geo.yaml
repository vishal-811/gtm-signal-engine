# Phrases that veto a match outright, checked before aliases. Entity names that
# contain a city name but say nothing about where a company is.
exclusions:
  - new york times
  - new york stock exchange
  - new york post
  - san francisco chronicle
  - bank of new york
  - bangalore rural

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Test
        # No secrets are provided on purpose: the suite runs entirely on
        # recorded fixtures and must never reach the network or spend tokens.
        run: pytest -q

      - name: Validate shipped config
        # Catches a rubric whose weights no longer sum to 1.0, a malformed
        # YAML file, or a prompt that was renamed — all of which would
        # otherwise surface at 02:30 UTC instead of in the pull request.
        run: signal-engine show-config

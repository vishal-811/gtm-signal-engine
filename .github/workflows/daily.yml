name: Daily signal run

on:
  schedule:
    # TEMPORARY — one-off slot to prove the scheduler fires in production.
    # Revert to "30 2 * * *" (02:30 UTC = 08:00 IST) once verified.
    - cron: "12 1 * * *"

  # Manual trigger, defaulting to a dry run so an accidental click never posts.
  workflow_dispatch:
    inputs:
      live:
        description: "Publish to Sheets and Slack (otherwise dry run)"
        type: boolean
        default: false
      limit:
        description: "Process at most N articles (blank = all)"
        type: string
        default: ""

concurrency:
  # Two overlapping runs would double-post and race on the `seen` ledger.
  group: signal-engine-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Generous: the ATS discovery stage makes many sequential HTTP calls and a
    # high-volume news day can push a run past the default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the version this is developed and tested against.
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build .env from repository secrets and variables
        # Written as a file rather than passed as `env:` entries. An unset
        # `vars.X` expands to an empty string, which pydantic reads as a real
        # value of "" and uses instead of the default in config.py — so the
        # workflow needed a hardcoded fallback per setting, and every one of
        # them had drifted from what the pipeline actually runs with. Skipping
        # blank lines here means config.py owns the defaults, in one place.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_USER_AGENT: ${{ vars.OPENAI_USER_AGENT }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_STRUCTURED_MODE: ${{ vars.LLM_STRUCTURED_MODE }}
          LLM_MAX_CONCURRENCY: ${{ vars.LLM_MAX_CONCURRENCY }}
          LLM_EXTRACT_BATCH_SIZE: ${{ vars.LLM_EXTRACT_BATCH_SIZE }}
          LLM_REQUEST_TIMEOUT: ${{ vars.LLM_REQUEST_TIMEOUT }}
          OPENAI_INPUT_COST_PER_MTOK: ${{ vars.OPENAI_INPUT_COST_PER_MTOK }}
          OPENAI_OUTPUT_COST_PER_MTOK: ${{ vars.OPENAI_OUTPUT_COST_PER_MTOK }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          SENDER_TITLE: ${{ vars.SENDER_TITLE }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          SENDER_COMPANY: ${{ vars.SENDER_COMPANY }}
          DEDUPE_WINDOW_DAYS: ${{ vars.DEDUPE_WINDOW_DAYS }}
          MAX_ARTICLE_AGE_HOURS: ${{ vars.MAX_ARTICLE_AGE_HOURS }}
          MAX_EVENT_AGE_DAYS: ${{ vars.MAX_EVENT_AGE_DAYS }}
          APOLLO_ENABLED: ${{ vars.APOLLO_ENABLED }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib

          names = [
              "OPENAI_API_KEY", "OPENAI_BASE_URL", "OPENAI_USER_AGENT",
              "OPENAI_MODEL", "LLM_STRUCTURED_MODE", "LLM_MAX_CONCURRENCY",
              "LLM_EXTRACT_BATCH_SIZE", "LLM_REQUEST_TIMEOUT",
              "OPENAI_INPUT_COST_PER_MTOK", "OPENAI_OUTPUT_COST_PER_MTOK",
              "GOOGLE_SHEET_ID", "GOOGLE_SERVICE_ACCOUNT_JSON",
              "SLACK_WEBHOOK_URL", "SENDER_NAME", "SENDER_TITLE",
              "SENDER_EMAIL", "SENDER_COMPANY", "DEDUPE_WINDOW_DAYS",
              "MAX_ARTICLE_AGE_HOURS", "MAX_EVENT_AGE_DAYS",
              "APOLLO_ENABLED", "APOLLO_API_KEY",
          ]
          lines, present = [], []
          for name in names:
              value = os.environ.get(name, "").strip()
              if not value:
                  continue
              # The service-account JSON is multi-line; keep it on one line so
              # the file stays a valid .env.
              lines.append(f"{name}={value.replace(chr(10), '')}")
              present.append(name)
          pathlib.Path(".env").write_text("\n".join(lines) + "\n")
          print(f"wrote .env with {len(present)} setting(s):")
          for name in present:
              print(f"  - {name}")
          missing = [n for n in ("OPENAI_API_KEY", "GOOGLE_SHEET_ID",
                                 "GOOGLE_SERVICE_ACCOUNT_JSON") if n not in present]
          if missing:
              raise SystemExit(
                  "Missing required secret(s): " + ", ".join(missing)
                  + "\nSet them under Settings -> Secrets and variables -> Actions."
              )
          PY

      - name: Show effective configuration
        # Prints resolved settings with secrets redacted, so a failed run can
        # be diagnosed from the log without re-running it.
        run: signal-engine show-config || true

      - name: Run pipeline
        id: pipeline
        run: |
          set -o pipefail
          ARGS=""
          # Scheduled runs are always live. Manual runs publish only when the
          # `live` input is explicitly checked.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            ARGS="--live"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: signal-engine run $ARGS"
          signal-engine run $ARGS 2>&1 | tee run.log

      - name: Remove credentials
        if: always()
        run: rm -f .env

      - name: Notify Slack on failure
        # The pipeline posts its own alert when it fails internally. This
        # catches the cases it cannot: dependency install failures, timeouts,
        # a cancelled job — anything where the process never got far enough to
        # report for itself. Without it, a broken cron is indistinguishable
        # from a quiet day.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not url:
              print("SLACK_WEBHOOK_URL not set; skipping failure notification")
              raise SystemExit(0)
          text = (
              ":rotating_light: *Signal Engine workflow failed*\n"
              f"The daily run did not complete. <{os.environ['RUN_URL']}|View the logs>"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({"text": text}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as exc:
              # Never let the notifier mask the real failure in the logs.
              print(f"failure notification could not be delivered: {exc}")
          PY

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 14
          if-no-files-found: ignore
